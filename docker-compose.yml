services:
  api:
    build: .
    expose:
      - "5000"
  ui:
    build: ./ui
    environment:
      - API_URL=http://api:5000
    expose:
      - "8501"
    depends_on:
      - api
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./docker/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api
      - ui